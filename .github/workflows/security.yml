name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit direct dependencies (block on vulnerabilities)
        run: pip-audit --requirement <(pip show $(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project']['dependencies']
          print(' '.join(d.split('==')[0].split('>=')[0] for d in deps))
          ") | grep -oP 'Name: \K\S+' | tr '\n' ' ') --no-deps
      - name: Install project with dev extras
        run: pip install -e ".[dev]"
      - name: Audit all dependencies (warn on transitive)
        run: pip-audit --continue-on-error || true

  bandit:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Install bandit
        run: pip install bandit==1.8.3
      - name: Run bandit
        run: bandit -r app/backend/ -ll --exclude tests

  ruff:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Install ruff
        run: pip install ruff==0.15.1
      - name: Run ruff check
        run: ruff check .

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -f docker/Dockerfile -t bimemo-ci:ci ..
      - name: Run tests inside the container
        # Runs the suite in the exact production image with the fresh checkout
        # mounted over the baked-in source (mirrors the dev compose mounts).
        # Test environment is self-contained in tests/conftest.py; no secrets
        # are required.
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/app/backend:/app/backend:ro" \
            -v "${GITHUB_WORKSPACE}/tests:/app/tests:ro" \
            -v "${GITHUB_WORKSPACE}/pyproject.toml:/app/pyproject.toml:ro" \
            -v "${GITHUB_WORKSPACE}/.coveragerc:/app/.coveragerc:ro" \
            -v "${GITHUB_WORKSPACE}/scripts:/app/scripts:ro" \
            -v "${GITHUB_WORKSPACE}/docker/caddy:/app/docker/caddy:ro" \
            bimemo-ci:ci python -m pytest --cov
