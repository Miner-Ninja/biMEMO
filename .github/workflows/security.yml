name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit direct dependencies (block on vulnerabilities)
        run: pip-audit --requirement <(pip show $(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project']['dependencies']
          print(' '.join(d.split('==')[0].split('>=')[0] for d in deps))
          ") | grep -oP 'Name: \K\S+' | tr '\n' ' ') --no-deps
      - name: Install project with dev extras
        run: pip install -e ".[dev]"
      - name: Audit all dependencies (warn on transitive)
        run: pip-audit --continue-on-error || true

  bandit:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit==1.8.3
      - name: Run bandit
        run: bandit -r app/backend/ -ll --exclude app/backend/tests

  ruff:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.1
      - name: Run ruff check
        run: ruff check .

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with dev extras
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=app --cov-fail-under=90 -x
