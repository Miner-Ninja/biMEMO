name: ✨ Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's getting in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've weighed, and why you set them aside.
  - type: textarea
    id: boundaries
    attributes:
      label: Trust / architecture impact
      description: >
        biMEMO enforces strict process and socket trust boundaries (memory
        writes via the orchestrator, credentials via the credential proxy, the
        web tier reads only). If your idea touches those, note how it stays
        within them.
