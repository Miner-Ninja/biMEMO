services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: tei-bge-m3
    restart: unless-stopped
    ports:
      - "14435:80"
    volumes:
      - tei_cache:/data
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    command:
      - --model-id
      - BAAI/bge-m3
      - --port
      - "80"
      - --hostname
      - 0.0.0.0
      - --max-client-batch-size
      - "32"
      - --max-batch-tokens
      - "16384"

volumes:
  tei_cache: {}
