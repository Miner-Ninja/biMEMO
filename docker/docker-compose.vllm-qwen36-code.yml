services:
  vllm-qwen36-code:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen36-code
    restart: unless-stopped
    ipc: host
    ports:
      - "12435:8000"
    volumes:
      - vllm_qwen36_code_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
      CUDA_VISIBLE_DEVICES: "0,1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,max_split_size_mb:512"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_FLOAT32_MATMUL_PRECISION: "high"
    command:
      - --model
      - webhie/Qwen3.6-27B-int4-AutoRound-Code
      - --served-model-name
      - qwen3.6:27b-code-4bit
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --quantization
      - auto_round
      - --dtype
      - auto
      - --max-model-len
      - "200704"
      - --tensor-parallel-size
      - "2"
      - --max-num-seqs
      - "4"
      - --gpu-memory-utilization
      - "0.80"
      - --kv-cache-dtype
      - fp8_e4m3
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  vllm_qwen36_code_cache: {}
