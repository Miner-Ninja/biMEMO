services:
  vllm-primary:
    image: vllm/vllm-openai:latest
    container_name: vllm-primary
    restart: unless-stopped
    ipc: host
    ports:
      - "12434:8000"
    volumes:
      - vllm_primary_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
      CUDA_VISIBLE_DEVICES: "0,1"
    command:
      - --model
      - Qwen/Qwen3.5-35B-A3B
      - --served-model-name
      - qwen3.5:35b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "16384"
      - --tensor-parallel-size
      - "2"
      - --gpu-memory-utilization
      - "0.92"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  vllm_primary_cache: {}
