services:
  vllm-primary:
    image: vllm/vllm-openai:gemma4
    container_name: vllm-primary
    restart: unless-stopped
    ipc: host
    ports:
      - "12434:8000"
    volumes:
      - vllm_primary_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
      CUDA_VISIBLE_DEVICES: "0,1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    command:
      - --model
      - cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.95"
      - --max-num-seqs
      - "4"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --limit-mm-per-prompt
      - '{"image":1,"audio":1}'
      - --async-scheduling
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  vllm_primary_cache: {}
