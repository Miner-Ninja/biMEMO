version: "3.9"

services:
  ollama-primary:
    image: ollama/ollama:latest
    container_name: ollama-primary
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_primary_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  ollama-memory:
    image: ollama/ollama:latest
    container_name: ollama-memory
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_memory_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  ollama-init-primary:
    image: ollama/ollama:latest
    container_name: ollama-init-primary
    depends_on:
      - ollama-primary
    volumes:
      - ollama_primary_data:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 5
        ollama pull qwen3.5:35b
    environment:
      OLLAMA_HOST: "ollama-primary:11434"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  ollama-init-memory:
    image: ollama/ollama:latest
    container_name: ollama-init-memory
    depends_on:
      - ollama-memory
    volumes:
      - ollama_memory_data:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 5
        ollama pull qwen3.5:2b
    environment:
      OLLAMA_HOST: "ollama-memory:11434"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  ollama_primary_data: {}
  ollama_memory_data: {}
