[project]
name = "bimemo"
version = "0.1.0"
description = "Self-hosted personal AI assistant with security-first architecture"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",             # Upgraded for fastmcp 3.x (starlette 1.x)
    "uvicorn[standard]==0.40.0",    # Verified 2026-02-14
    "pydantic==2.12.5",             # Verified 2026-02-14
    "pydantic-settings==2.12.0",    # Verified 2026-02-14
    "httpx==0.28.1",                # Verified 2026-02-14
    "aiogram==3.25.0",              # Verified 2026-02-14
    "ollama==0.6.1",                # Verified 2026-02-14
    "cryptography==46.0.5",         # Verified 2026-02-14
    "PyJWT==2.11.0",                # Verified 2026-02-14
    "argon2-cffi==25.1.0",          # Verified 2026-02-14
    "sqlcipher3-binary==0.6.0",     # Verified 2026-02-14
    "sqlite-vec==0.1.6",            # Verified 2026-02-14
    "discord.py==2.6.4",             # Verified 2026-02-24
    "psutil==7.2.2",                # Verified 2026-02-14
    "structlog==24.4.0",            # Verified 2026-02-22
    "fastmcp==3.4.5",               # MCP Streamable HTTP transport for external agents
    "snowballstemmer==3.0.1",       # Verified 2026-02-23
    "python-multipart==0.0.32",     # Required for FastAPI UploadFile; fastmcp needs >=0.0.26
    "trafilatura==2.0.0",           # Verified 2026-03-30
    "croniter==6.2.2",              # Verified 2026-04-06
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.1",                 # Verified 2026-02-14
    "pytest==9.0.2",                # Verified 2026-02-14
    "pytest-asyncio==1.3.0",        # Verified 2026-02-14
    "pytest-cov==7.0.0",            # Verified 2026-02-14
    "pip-audit==2.10.0",            # Verified 2026-02-14
    "bandit==1.8.3",                # Verified 2026-02-22
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["app", "tests"]
exclude = [".git", ".venv", "__pycache__", "migrations"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "SIM", "RUF",
    "D", "ANN", "S", "C4", "PT", "RET", "TCH", "LOG", "ASYNC",
]
ignore = ["D203", "D213", "S101"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# RUF001 (ambiguous-unicode) flags legitimate Cyrillic letters that look like
# Latin (а/е/ш) in these files' user-facing Russian strings; per-line noqa
# would bury the text, so the ignore is explicit here.
"app/backend/memory/classification/resolver.py" = ["RUF001"]
"app/backend/processes/db_proxy/handlers/skill.py" = ["RUF001"]
# B008 (function call in a default argument) is the standard FastAPI
# Depends() idiom used throughout the route files.
"app/backend/processes/fastapi_app/routes/*.py" = ["B008"]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S603", "S607", "ANN", "ASYNC"]
# S310 (use of random) and RUF001 (Cyrillic seed text): the seed/stress
# scripts exist to generate randomized data. S603/S607 (subprocess) are
# exempted like in tests: ops scripts run trusted, static commands.
"scripts/**/*.py" = ["D", "ANN", "RUF001", "S310", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["app", "backend"]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
fail_under = 74
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
